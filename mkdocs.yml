site_name: Documentação do FAKO
site_description: Jogo educativo de avaliação de confiabilidade e classificador de veracidade treinado com bases brasileiras de fake news.
docs_dir: doc

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search

nav:
  - Visão geral: index.md
  - Requisitos:
      - Visão do produto: requisitos/visao-do-produto.md
      - Decisões de produto: requisitos/decisoes-de-produto.md
      - Técnicas de elicitação: requisitos/tecnicas-elicitacao.md
      - Perguntas norteadoras: requisitos/perguntas-norteadoras.md
      - Requisitos funcionais: requisitos/requisitos-funcionais.md
      - Requisitos não funcionais: requisitos/requisitos-nao-funcionais.md
      - Histórias de usuário: requisitos/historias-usuario.md
      - Matriz de rastreabilidade: requisitos/matriz-rastreabilidade.md
  - Arquitetura:
      - Visão geral: arquitetura/visao-geral.md
      - Decisões de arquitetura: arquitetura/decisoes.md
      - Esquema do banco: arquitetura/schema.md
  - Produto:
      - Banco de perguntas do jogo: banco-perguntas.md
      - Notícias externas e classificador: noticias-classificador.md
      - LLM na API: llm.md
  - Pesquisa e dados:
      - Análise exploratória dos dados: eda.md
      - Dataset de verdadeiros confiáveis: dataset-verdadeiras.md
      - Guia de classificação e anotação: guia-classificacao.md
      - Padronização do texto curto pela LLM: padronizacao.md
      - Planejamento de coleta e retreino: planejamento-retreino.md
  - Modelo:
      - Relatório técnico do classificador: relatorio-tecnico.md
  - Glossário: glossario.md
