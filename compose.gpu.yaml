# GPU NVIDIA no container de treino (make bert GPU=1). Exige o NVIDIA Container Toolkit no
# host; sem ele, use o compose.yaml sozinho (PyTorch CPU).
services:
  ml:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu130
    image: fako-ml-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
