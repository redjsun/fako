[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# treinar_bert.py e classificar.py exigem requirements-treino.txt (PyTorch), fora do job "ML" do CI.
omit = ["tests/*", "treinar_bert.py", "classificar.py"]
