# Variante da referência no texto padronizado pela LLM (#20). Mesmo prompt e modelo do cache.
nome = "referencia-padronizado"
modelo = "referencia"
saida = "models/2026-11/referencia-padronizado"
sementes = [42]

[dados]
dataset = "pesquisa/data/processed/dataset.jsonl"
texto = "padronizado"
prompt = "api/app/prompts/extrair_afirmacoes_v1.txt"
# modelo_llm: o LLM_MODEL do .env, o mesmo que gerou o cache (ou fixe aqui a versão)

[treino]
ngram_palavras = [1, 2]
min_df = 3
max_df = 0.9
sublinear_tf = true
ngram_caracteres = [3, 5]
grade_c = [0.25, 0.5, 1, 2, 4, 8, 16]
max_iter = 2000
