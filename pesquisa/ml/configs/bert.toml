# Experimento 2: BERTimbau com cabeça ordinal CORAL, issue #10.
nome = "bert"
modelo = "bert"
saida = "models/2026-11/bert"
sementes = [13, 42, 7]   # média e desvio das 3; em CPU, --sementes 42 para uma rodada só

[dados]
dataset = "pesquisa/data/processed/dataset.jsonl"
texto = "original"

[treino]
modelo_base = "neuralmind/bert-base-portuguese-cased"
max_tokens = 96
taxa_aprendizado = 3e-5   # testar também 2e-5 e 5e-5
weight_decay = 0.01
aquecimento = 0.1
lote = 32
max_epocas = 4
parada_antecipada = "f1_macro_validacao"
paciencia = 1   # épocas sem melhora antes de parar
