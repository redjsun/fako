# PRs para a develop. Atualizações semanais: actions (fixadas por SHA), npm do web e pip da API.
# Pausado depois da entrega (open-pull-requests-limit: 0): para religar, volte o limite a 5.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directories:
      - /api
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directories:
      - /api
      - /web
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
