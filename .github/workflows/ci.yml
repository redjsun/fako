name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fako
          POSTGRES_PASSWORD: fako
          POSTGRES_DB: fako_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fako -d fako_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fako:fako@localhost:5432/fako_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Migrações
        run: alembic upgrade head

      - name: Testes
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Auditoria de dependências
        run: pip-audit
        continue-on-error: true

  ml:
    name: ML (lint e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pesquisa/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pesquisa/ml/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        run: pytest -v --cov=. --cov-report=term-missing --cov-fail-under=75

      - name: Auditoria de dependências
        run: pip-audit
        continue-on-error: true

  web:
    name: Web (tipos, lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --audit-level=high
        continue-on-error: true

  docs:
    name: Docs (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install mkdocs-material

      - name: Build
        run: mkdocs build --strict

      - name: Verificar links externos
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "doc/**/*.md" README.md
        continue-on-error: true

  docker:
    name: Docker (build das imagens)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # bake-action lê o cache (x-bake) do compose.yaml e expõe o token do cache do GitHub;
      # os targets são os que o `docker compose build` constrói sem profile.
      - name: Build
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          targets: api,web,agendador
